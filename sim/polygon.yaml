# The polygon's test house (D40: no room agents; the learner runs in-process, D38). `python -m
# sim.polygon run` applies `settings` to a fresh add-on, plays each scenario, then wakes the house
# manager once and checks the invariants (sim/polygon.py). Per scenario:
#   learner_events:  entities whose changes must reach the learner's journal
#   manager_script:  steps queued on the fake Claude before the manager's wake (fake backend only)
#   actions:         entities the manager must have switched for real (checked with --live only)
# Copy this file and pass it with --spec to test your own expectations.

settings:
  manager_enabled: true
  manager_sweep_min: 0  # the polygon wakes the manager itself after each scenario
  manager_max_wakes_per_hour: 30

scenarios:
  arrive_home:
    learner_events: [binary_sensor.front_door_contact, binary_sensor.hallway_motion]
    # the manager switches the hallway light on as the orchestrator: live, through the policy
    manager_script:
      - tool_use:
          - {name: call_service, input: {domain: light, service: turn_on, entity_id: light.hallway, data: {}}}
      - {text: "Switched the hallway light on."}
    actions: [light.hallway]
  leave_home:
    learner_events: [lock.front_door, person.owner]
  evening:
    learner_events: [media_player.living_room_tv]
  night:
    learner_events: [light.bedroom_lamp]
  window_while_heating:
    learner_events: [binary_sensor.bedroom_window]
    # a T3 lock, asked for by the model: always denied, never sent (also live)
    manager_script:
      - tool_use:
          - {name: call_service, input: {domain: lock, service: unlock, entity_id: lock.front_door, data: {}}}
      - {text: "Could not unlock."}
  smoke: {}
  water_leak: {}
  zigbee_outage: {}
  router_reboot: {}
  presence_flapping: {}
