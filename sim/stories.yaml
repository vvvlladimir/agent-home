# Stories for `python -m sim.stories` (docs/POLYGON.md §4c): a lived household (sim/household.py)
# plus what we inject, and what must be true afterwards (Given - When - Then). Since D40 the house has
# no room agents: the learner (jetson/learner, in-process, training every house night at 03:30) and
# the orchestrator (drafts, the daily review, the house manager) are the actors.
#
# entity: an id, or a glob resolved against the house ("binary_sensor.*_water_leak"); a story whose
#   entity the house lacks is skipped, not failed.
# habits: a person's own routine on top of the household (what the house should learn). D35: a habit
#   has a cause, `anchor: {entity, state, after_s}` (the hand follows that household event; the off
#   side: `anchor_off`); a habit with only "on"/"off" clock times has none, and must not become an
#   automation.
# incidents: one-off events with a tag. owner_automations: the owner's own HA automation does a
#   household change instead of the hand (`days: workdays` leaves the weekend to the hand).
# light_controllers: the owner's light controller automation (`ref`): `light` on with `sensor` in the
#   evening, off `timeout_s` after it went quiet; the sensor drops out while someone sits still and
#   the person switches the light back on (a correction); a real walk out shows on `elsewhere`.
# answers: the owner taps a button of one of our asks (`action: AGENT_HOUSE_<target>_<state>[_NO]`).
# learner: off lives the story with the learner down (the add-on's own predict.py decides).
# live: true puts the global mode and both actors live (learner_mode, orchestrator_mode).
# More given: habits take on_state / off_state (covers open/closed, locks locked/unlocked);
#   incidents take back_state; helpers create an HA helper first (the kill switch input_boolean);
#   owner: {approve: none} says no to every draft (default: approve drafts on the story's habits);
#   owner: {explain: <provider>} asks that model what each draft does before deciding (D37);
#   mode_helper: true creates the house mode helper through the add-on's API, as the owner does.
#
# expect: checks on the lived trace. triggers_on: the deployed automation for an entity triggers on
#   the habit's cause; report_about takes severity; never_actuated (no action that was not denied, no
#   deployed automation acting on it); house_mode (the mode was set within N min after a note or tag);
#   max_manager_runs_per_day; quiet_while_tag (no run and no action while a helper is on);
#   habits_source (learner | addon: where the last scan's habits came from); finding (an id prefix);
#   manager_woken_by (text in a manager run's wake reason); learner_acted {entity, verdict} (n/a when
#   no training offered it as a live target); asks {yes, no, fired: at least}; explained (a provider).
#   `model: true` on an expectation: judged only with a real model (the fakes answer "OK.").
stories:
  # --- habits: learnt, drafted without a model, deployed right ---------------------------------------
  counter_follows_ceiling:
    about: >-
      The counter light goes on right after the ceiling light and off with it (D35: a cause). It
      becomes an automation that triggers on the ceiling light, never on a clock.
    days: 10
    habits:
      - {entity: light.kitchen_counter, anchor: {entity: light.kitchen_ceiling, state: "on", after_s: 40},
         anchor_off: {entity: light.kitchen_ceiling, state: "off", after_s: 20}}
    expect:
      - {proposal_for: light.kitchen_counter, by_day: 9}
      - {deployed_for: light.kitchen_counter}
      - {triggers_on: light.kitchen_counter, cause: light.kitchen_ceiling}
      - {max_proposals_for: light.kitchen_counter, count: 2}
      - {max_reports_per_day: 8}

  learner_habits_replace_the_scan:
    about: >-
      D38: once the learner has trained, the daily scan takes its habits (the same D35 code over the
      learner's longer journal) instead of the add-on's own 14 days; the counter habit is proposed
      from them.
    days: 10
    habits:
      - {entity: light.kitchen_counter, anchor: {entity: light.kitchen_ceiling, state: "on", after_s: 40},
         anchor_off: {entity: light.kitchen_ceiling, state: "off", after_s: 20}}
    expect:
      - {habits_source: learner}
      - {proposal_for: light.kitchen_counter, by_day: 10}
      - {max_proposals_for: light.kitchen_counter, count: 2}

  learner_down_predict_takes_over:
    about: >-
      D38: with the learner down the whole time, the add-on's own predict.py still finds the counter
      habit and drafts it; nothing waits for the Jetson.
    days: 10
    learner: "off"
    habits:
      - {entity: light.kitchen_counter, anchor: {entity: light.kitchen_ceiling, state: "on", after_s: 40},
         anchor_off: {entity: light.kitchen_ceiling, state: "off", after_s: 20}}
    expect:
      - {habits_source: addon}
      - {proposal_for: light.kitchen_counter, by_day: 9}
      - {deployed_for: light.kitchen_counter}

  clock_only_habit_waits:
    about: >-
      A lamp switched at about the same time every evening, with nothing that causes it, is not
      automated by the clock (D35): people do not need a lamp at 21:30, they need it when something
      happens.
    days: 10
    habits:
      - {entity: light.kitchen_counter, "on": "21:30", "off": "23:40", sd_min: 40, days: all}
    expect:
      - {max_proposals_for: light.kitchen_counter, count: 0}

  owner_automation_covers_part:
    about: >-
      The owner's automation switches the TV off on workdays; at weekends they do it by hand. The
      add-on may propose the rest (the evening on, the weekend off) but never a second workday off.
    days: 10
    owner_automations:
      - {ref: automation.tv_off_at_night, entity: media_player.living_room_tv, state: "off", days: workdays}
    expect:
      - {owner_part_not_repeated: automation.tv_off_at_night}
      - {max_proposals_for: media_player.living_room_tv, count: 1}

  blinds_close_at_bedtime:
    about: >-
      The bedroom blinds (a T2 cover) close when the bedroom lamp goes on at bedtime; they open in the
      morning after the kitchen light, which the bedroom does not see (another room). One automation
      closes them on the lamp; none opens them by the clock.
    # once a day: a rule needs 4 right fires on days it had not seen, so about a week and a half
    days: 14
    habits:
      - {entity: cover.bedroom_blinds, on_state: open, off_state: closed,
         anchor: {entity: light.kitchen_ceiling, state: "on", after_s: 300},
         anchor_off: {entity: light.bedroom_lamp, state: "on", after_s: 30}}
    expect:
      - {proposal_for: cover.bedroom_blinds, by_day: 13}
      - {deployed_for: cover.bedroom_blinds}
      - {triggers_on: cover.bedroom_blinds, cause: light.bedroom_lamp}
      - {max_proposals_for: cover.bedroom_blinds, count: 1}

  owner_says_no:
    about: An owner who rejects a draft is not asked again for the same thing.
    days: 12
    owner: {approve: none}
    habits:
      - {entity: light.kitchen_counter, anchor: {entity: light.kitchen_ceiling, state: "on", after_s: 40},
         anchor_off: {entity: light.kitchen_ceiling, state: "off", after_s: 20}}
    expect:
      - {proposal_for: light.kitchen_counter, by_day: 9}
      # on and off are two proposals; each is asked once, never again after a no
      - {max_proposals_for: light.kitchen_counter, count: 2}

  owner_asks_what_a_draft_does:
    about: >-
      D37: before deciding, the owner asks what each draft does, on the model they pick for that one
      request (OpenAI, the setting says auto); asking again is free (cached per YAML and language).
    days: 10
    owner: {explain: openai}
    habits:
      - {entity: light.kitchen_counter, anchor: {entity: light.kitchen_ceiling, state: "on", after_s: 40},
         anchor_off: {entity: light.kitchen_ceiling, state: "off", after_s: 20}}
    expect:
      - {explained: openai}
      - {deployed_for: light.kitchen_counter}

  # --- the learner live: shadow by default, only devices of a fresh model --------------------------
  learner_suggests_in_shadow:
    about: >-
      D39: the learner's live suggestions for the counter go through the actuator as agent `learner`
      and stay in shadow: recorded, never sent; never a helper such as the house mode.
    days: 10
    mode_helper: true
    habits:
      - {entity: light.kitchen_counter, anchor: {entity: light.kitchen_ceiling, state: "on", after_s: 40},
         anchor_off: {entity: light.kitchen_ceiling, state: "off", after_s: 20}}
    expect:
      - {learner_acted: light.kitchen_counter, verdict: shadow}
      - {never_actuated: input_select.agent_house_mode}

  learner_acts_live:
    about: >-
      With the global mode and learner_mode live, an earned live suggestion switches the counter for
      real, through the policy (T0), and nothing else.
    days: 10
    live: true
    habits:
      - {entity: light.kitchen_counter, anchor: {entity: light.kitchen_ceiling, state: "on", after_s: 40},
         anchor_off: {entity: light.kitchen_ceiling, state: "off", after_s: 20}}
    expect:
      - {learner_acted: light.kitchen_counter, verdict: executed}

  # --- the owner's light controller, corrected too often ---------------------------------------------
  light_controller_corrected:
    about: >-
      D38: the owner's light controller switches the living-room lamp off two minutes after the radar
      went quiet; sitting still, the radar drops out and the owner switches the lamp back on. The
      learner finds the timeout the corrections ask for, the add-on makes it a finding, the house
      manager's prefilter wakes on it, and the draft is ours: the owner's automation is never edited.
    days: 12
    settings: {manager_enabled: true, manager_sweep_min: 60}
    light_controllers:
      - {ref: automation.lamp_controller, light: light.living_room_lamp,
         sensor: binary_sensor.living_room_motion_occupancy, elsewhere: binary_sensor.kitchen_motion_occupancy,
         timeout_s: 120}
    expect:
      - {finding: "timeout:light.living_room_lamp:automation.lamp_controller"}
      - {manager_woken_by: "learner:"}
      - {max_manager_runs_per_day: 6}
      - {proposal_for: light.living_room_lamp, model: true}

  # --- asks: the No button reaches the learner -------------------------------------------------------
  ask_answers_reach_the_learner:
    about: >-
      D38 step 6: the owner taps Yes and No on our ask notifications; the add-on forwards each answer
      to the learner, which counts them in the house model.
    days: 4
    answers:
      - {day: 1, at: "19:10", action: AGENT_HOUSE_LIGHT_KITCHEN_COUNTER_ON}
      - {day: 2, at: "19:15", action: AGENT_HOUSE_LIGHT_KITCHEN_COUNTER_ON_NO}
      - {day: 3, at: "19:05", action: AGENT_HOUSE_LIGHT_KITCHEN_COUNTER_ON_NO}
    expect:
      - {asks: {"yes": 1, "no": 2}}

  # --- noise: no draft built on lies -------------------------------------------------------------------
  lying_sensors:
    about: Ghost motion, a stuck sensor and temperature spikes cause no alarms and no new habits.
    days: 6
    chaos: {ghost_motion: 3.0, stuck: 0.5, spike: 1.0}
    expect:
      - {no_alarm_after_tag: "fault:ghost_motion", within_min: 10}
      - {no_alarm_after_tag: "fault:spike", within_min: 10}
      - {no_proposal_from_tag: "fault:ghost_motion"}

  flaky_network_sensors:
    about: Dropouts, a flapping presence tracker and a bouncing door contact cause no alarm and no draft.
    days: 5
    chaos: {dropout: 3.0, flapping: 2.0, bounce: 3.0, ghost_motion: 0.0, stuck: 0.0, spike: 0.0}
    expect:
      - {no_alarm_after_tag: "fault:dropout", within_min: 30}
      - {no_alarm_after_tag: "fault:flapping", within_min: 30}
      - {no_alarm_after_tag: "fault:bounce", within_min: 30}
      - {no_proposal_from_tag: "fault:bounce"}

  drifting_thermometer:
    about: A bedroom thermometer that drifts a degree a day causes no alarm and no heating draft built on it.
    days: 8
    chaos: {drift_c_per_day: 1.0}
    expect:
      - {no_alarm_after_tag: "fault:drift", within_min: 60}
      - {no_proposal_from_tag: "fault:drift"}

  guests_and_sick_days:
    about: Guest evenings and days off sick change the house for a day; none of them becomes a draft.
    days: 10
    chaos: {guests: 0.6, sick_day: 0.4, guest_mode: 0.5}  # half of the guest evenings marked by the owner
    expect:
      - {no_proposal_from_tag: "human"}
      - {max_reports_per_day: 6}

  calm_house:
    about: A tidy household stays cheap and quiet.
    days: 4
    chaos: calm
    expect:
      - {max_reports_per_day: 6}
      - {max_manager_runs_per_day: 0}

  # --- house modes and the house manager ------------------------------------------------------------
  lights_left_on_trip:
    about: The owner leaves for a trip with a lamp on; the house manager notices.
    days: 9
    settings: {manager_enabled: true, manager_sweep_min: 60}
    chaos: {trip_days: 4}
    incidents:
      - {entity: light.living_room_lamp, state: "on", on_tag_note: "trip starts", after_min: -3, tag: "incident:left_on"}
    expect:
      - {manager_woken_by: "nobody is home and still on: "}
      - {report_about: light.living_room_lamp, after_tag: "incident:left_on", within_min: 180, model: true}
      # stories 2026-11-15 F1: in shadow the lamps stay on; 13-20 manager runs a day spent the budget
      - {max_manager_runs_per_day: 6}

  away_mode_follows_trip:
    about: With automatic modes on, the house goes to away when the owner leaves for a trip and back to home.
    days: 9
    settings: {auto_house_mode: true}
    mode_helper: true  # the owner creates input_select.agent_house_mode first (POST api/council/mode-helper)
    chaos: {trip_days: 3}
    expect:
      - {house_mode: away, after_note: "trip starts", within_min: 30}
      - {house_mode: home, after_note: "back from the trip", within_min: 30}

  # --- T3: watched, never touched --------------------------------------------------------------------
  t3_habits_never_automated:
    about: >-
      The owner opens the garage and locks the door by hand at the same times every day. Even an owner
      who approves every draft, with the learner and the global mode live, never gets an automation or
      an action that touches a T3 entity.
    days: 10
    live: true
    habits:
      - {entity: "cover.garage*", "on": "07:40", "off": "07:50", sd_min: 6, days: workdays,
         on_state: open, off_state: closed}
      - {entity: lock.front_door, "on": "23:05", "off": "07:30", sd_min: 20, days: all,
         on_state: locked, off_state: unlocked}
    expect:
      - {never_actuated: "cover.garage*"}
      - {never_actuated: lock.front_door}

  # --- the kill switch halts everything --------------------------------------------------------
  kill_switch_holds:
    about: >-
      While the owner holds the kill switch helper on for two evening hours, nothing runs and nothing
      acts: no house manager, no learner suggestion, with everything live.
    days: 3
    live: true
    settings: {kill_switch_entity: input_boolean.agent_house_kill, manager_enabled: true, manager_sweep_min: 15}
    helpers:
      - {entity: input_boolean.agent_house_kill, state: "off", name: Agent House kill switch}
    chaos: {guests: 1.0}
    incidents:
      - {entity: input_boolean.agent_house_kill, state: "on", day: 1, at: "19:00", back_after_min: 120,
         tag: "incident:kill"}
    expect:
      - {quiet_while_tag: "incident:kill"}
