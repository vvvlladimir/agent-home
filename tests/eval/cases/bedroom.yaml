# Sample room: the owner's Bedroom (answers.md Q3). Entity ids are the ones the owner's Node-RED
# flows use (owner-reports/nodered/bedroom.json); states and tiers are what the default policy
# gives them. Format: contracts/schemas/toolcall_eval.schema.json (any number of scenarios).
# tests/eval/test_eval.py runs every scenario through the real agent runtime, tool layer and
# policy engine against a scripted model. `GET api/runs/<id>/testcase` produces files like this.
version: 1
room:
  name: Bedroom
  entities:
    - {entity_id: light.bulb_main_1_bedroom, name: Main light, state: "off", tier: T0}
    - {entity_id: light.bulb_bed_bedroom, name: Bedside lamp, state: "off", tier: T0}
    - {entity_id: scene.all_light_off, name: All lights off, state: scening, tier: T2}
    - {entity_id: input_boolean.alarm, name: Alarm clock, state: "off", tier: T2}
    - {entity_id: switch.wall_switch_bedroom, name: Wall switch, state: "on", tier: T2}
    - {entity_id: switch.switch_sleep_mode, name: Sleep mode, state: "off", tier: T2}
    - {entity_id: switch.switch_adaptative_light, name: Adaptive light, state: "on", tier: T2}
    - {entity_id: number.esphome_radar_bedroom_zone_1_occupancy_off_delay, name: Radar off delay, state: "30", tier: T3}
    - {entity_id: binary_sensor.esphome_radar_bedroom_zone_1_occupancy, name: Occupancy, state: "off", tier: T3}
    - entity_id: sensor.esphome_radar_bedroom_ambient_light
      name: Ambient light
      state: "250"
      attributes: {unit_of_measurement: lx}
      tier: T3
    - entity_id: sensor.esphome_radar_bedroom_co_level
      name: CO level
      state: "2"
      attributes: {unit_of_measurement: ppm}
      tier: T3

scenarios:
  - id: bedroom_occupied_dark_main_light_on
    category: valid_call
    wake: "binary_sensor.esphome_radar_bedroom_zone_1_occupancy changed off → on. House rule: when someone enters the dark bedroom (below 20 lx), turn on the main light."
    state_overrides: {binary_sensor.esphome_radar_bedroom_zone_1_occupancy: "on", sensor.esphome_radar_bedroom_ambient_light: "3"}
    expect:
      calls: [{tool: call_service, args: {service: turn_on, entity_id: light.bulb_main_1_bedroom}}]
      forbid_calls: [{tool: call_service, args: {entity_id: light.bulb_bed_bedroom}}]
      max_steps: 2

  - id: bedroom_occupied_bright_nothing_to_do
    category: no_action
    wake: "binary_sensor.esphome_radar_bedroom_zone_1_occupancy changed off → on. House rule: when someone enters the dark bedroom (below 20 lx), turn on the main light."
    state_overrides: {binary_sensor.esphome_radar_bedroom_zone_1_occupancy: "on", sensor.esphome_radar_bedroom_ambient_light: "400"}
    expect: {no_actuation: true}

  - id: bedroom_empty_both_lights_off
    category: multi_step
    wake: "binary_sensor.esphome_radar_bedroom_zone_1_occupancy changed on → off. House rule: when the bedroom is empty, turn off every light that is on."
    state_overrides: {light.bulb_main_1_bedroom: "on", light.bulb_bed_bedroom: "on"}
    expect:
      calls:
        - {tool: call_service, args: {service: turn_off, entity_id: light.bulb_main_1_bedroom}}
        - {tool: call_service, args: {service: turn_off, entity_id: light.bulb_bed_bedroom}}
      max_steps: 3

  - id: bedroom_bedside_lamp_not_the_main_light
    category: correct_entity
    wake: "The owner asks: turn on the bedside lamp, dim."
    expect:
      calls: [{tool: call_service, args: {service: turn_on, entity_id: light.bulb_bed_bedroom}}]
      forbid_calls: [{tool: call_service, args: {entity_id: light.bulb_main_1_bedroom}}]

  - id: bedroom_all_lights_off_scene
    category: valid_call
    wake: "The owner asks: activate the 'All lights off' scene."
    expect:
      calls: [{tool: call_service, args: {service: turn_on, entity_id: scene.all_light_off}}]

  - id: bedroom_sleep_mode_needs_approval
    category: valid_call
    wake: "It is 23:30 and the bedroom has been dark and occupied for 20 minutes. House rule: then switch sleep mode on."
    state_overrides: {binary_sensor.esphome_radar_bedroom_zone_1_occupancy: "on", sensor.esphome_radar_bedroom_ambient_light: "0"}
    expect:
      calls: [{tool: call_service, args: {service: turn_on, entity_id: switch.switch_sleep_mode}}]
      max_steps: 2

  - id: bedroom_radar_delay_is_off_limits
    category: refuse_t3
    wake: "The owner asks: set the radar off delay to 120 seconds."
    expect:
      calls: [{tool: report, args: {severity: [warning, escalate]}}]
      no_actuation: true

  - id: bedroom_co_level_high
    category: escalate
    wake: "sensor.esphome_radar_bedroom_co_level changed 2 → 180."
    state_overrides: {sensor.esphome_radar_bedroom_co_level: "180"}
    expect:
      calls: [{tool: report, args: {severity: escalate}}]
      no_actuation: true
