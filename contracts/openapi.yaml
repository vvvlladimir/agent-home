openapi: 3.1.0
info:
  title: Agent House internal API
  version: 0.5.0
  description: |
    JSON API between the add-on backend and its GUI. All paths are RELATIVE to the ingress
    root (the GUI calls `api/status`, never `/api/status`). `x-milestone` says in which
    milestone an operation was implemented. A path that is not here answers 404 `not_found` naming
    the routes under or near it; a known path with the wrong method answers 405 with `Allow`.
    File formats (policy, the learner's house model, …) live in `schemas/*.schema.json`.
    0.5.0 (D40): room agents and the local model are gone; the actors are the orchestrator /
    house manager and the Jetson learner.
servers:
  - url: .
tags:
  - {name: system}
  - {name: house}
  - {name: traces}
  - {name: safety}
  - {name: automations}
  - {name: migration}
  - {name: chat}
  - {name: council}
  - {name: settings}

paths:
  /api/status:
    get:
      tags: [system]
      operationId: getStatus
      x-milestone: M1
      summary: Everything the dashboard header needs, in one cheap call
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Status"}}}}
  /api/mode:
    put:
      tags: [safety]
      operationId: setMode
      x-milestone: M1
      summary: Switch the global mode. `live` only affects actors whose own mode is live (orchestrator_mode, learner_mode).
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [mode], properties: {mode: {$ref: "#/components/schemas/Mode"}}}}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Status"}}}}
  /api/kill-switch:
    put:
      tags: [safety]
      operationId: setKillSwitch
      x-milestone: M1
      summary: Engage or release the global kill switch. Engaged = no service call and no deploy leaves the add-on.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [engaged], properties: {engaged: {type: boolean}, reason: {type: string}}}}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Status"}}}}

  /api/areas:
    get:
      tags: [house]
      operationId: listAreas
      x-milestone: M1
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Area"}}}}}
  /api/entities:
    get:
      tags: [house]
      operationId: listEntities
      x-milestone: M1
      parameters:
        - {name: area, in: query, schema: {type: string}, description: "area_id; `none` = entities without an area"}
        - {name: domain, in: query, schema: {type: string}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Entity"}}}}}
  /api/events:
    get:
      tags: [traces]
      operationId: listEvents
      x-milestone: M1
      summary: Recent feed items, newest first
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 100, maximum: 500}}
        - {name: kind, in: query, schema: {type: string}}
        - {name: before, in: query, schema: {type: integer}, description: feed id to page from}
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/FeedItem"}}}}}
  /api/events/stream:
    get:
      tags: [traces]
      operationId: streamEvents
      x-milestone: M1
      summary: Server-Sent Events; each `data:` line is one FeedItem. A comment line is sent every 15 s as keep-alive.
      responses:
        "200": {description: event stream, content: {text/event-stream: {schema: {type: string}}}}

  /api/runs:
    get:
      tags: [traces]
      operationId: listRuns
      x-milestone: M3
      parameters:
        - {name: agent, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/RunStatus"}}
        - {name: limit, in: query, schema: {type: integer, default: 50, maximum: 200}}
        - {name: before, in: query, schema: {type: string}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/RunSummary"}}}}}
  /api/runs/{run_id}:
    parameters: [{$ref: "#/components/parameters/run_id"}]
    get:
      tags: [traces]
      operationId: getRun
      x-milestone: M3
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Run"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /api/policy:
    get:
      tags: [safety]
      operationId: getPolicy
      x-milestone: M3
      responses:
        "200": {description: "see schemas/policy.schema.json", content: {application/json: {schema: {type: object}}}}
    put:
      tags: [safety]
      operationId: putPolicy
      x-milestone: M3
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: object}}}}
        "422": {$ref: "#/components/responses/Error"}
  /api/actions:
    get:
      tags: [safety]
      operationId: listActions
      x-milestone: M3
      summary: Every policy decision about a service call (executed, shadow, denied, pending approval)
      parameters:
        - {name: agent, in: query, schema: {type: string}}
        - {name: verdict, in: query, schema: {$ref: "#/components/schemas/Verdict"}}
        - {name: limit, in: query, schema: {type: integer, default: 100}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Action"}}}}}
  /api/approvals/{action_id}:
    parameters: [{name: action_id, in: path, required: true, schema: {type: string}}]
    post:
      tags: [safety]
      operationId: decideApproval
      x-milestone: M3
      summary: Approve or deny a pending T2 action. Approval re-runs the policy check before executing.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [approve], properties: {approve: {type: boolean}}}}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Action"}}}}
        "409": {$ref: "#/components/responses/Error"}
  /api/inbox:
    get:
      tags: [safety]
      operationId: listInbox
      x-milestone: M3
      summary: The owner's inbox - the orchestrator's reports (review, first look, house manager, budget) and unusual-state notes
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/InboxItem"}}}}}

  /api/proposals:
    get:
      tags: [automations]
      operationId: listProposals
      x-milestone: M4
      parameters: [{name: status, in: query, schema: {$ref: "#/components/schemas/ProposalStatus"}}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Proposal"}}}}}
    post:
      tags: [automations]
      operationId: createProposal
      x-milestone: M4
      summary: "A new draft: the owner's own `yaml`, or a `request` in words that the orchestrator turns into YAML"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                yaml: {type: string}
                title: {type: string}
                rationale: {type: string}
                request: {type: string, maxLength: 2000}
                room: {type: string, description: "area id: limits the orchestrator to that room's entities"}
                ha_id: {type: string, description: "one of our deployed automations to change"}
                provider: {$ref: "#/components/schemas/ProviderChoice"}
      responses:
        "201": {description: drafted (status draft or blocked), content: {application/json: {schema: {$ref: "#/components/schemas/Proposal"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/proposals/{proposal_id}:
    parameters: [{$ref: "#/components/parameters/proposal_id"}]
    get:
      tags: [automations]
      operationId: getProposal
      x-milestone: M4
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Proposal"}}}}
    put:
      tags: [automations]
      operationId: editProposal
      x-milestone: M4
      summary: Owner edits the draft YAML; re-runs validation and the policy scan
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [yaml], properties: {yaml: {type: string}}}}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Proposal"}}}}
  /api/proposals/{proposal_id}/approve:
    parameters: [{$ref: "#/components/parameters/proposal_id"}]
    post:
      tags: [automations]
      operationId: approveProposal
      x-milestone: M4
      summary: Validate again, deploy to HA as `agent_house_<slug>`, write a version row
      responses:
        "200": {description: deployed, content: {application/json: {schema: {$ref: "#/components/schemas/Proposal"}}}}
        "409": {$ref: "#/components/responses/Error"}
  /api/proposals/{proposal_id}/reject:
    parameters: [{$ref: "#/components/parameters/proposal_id"}]
    post:
      tags: [automations]
      operationId: rejectProposal
      x-milestone: M4
      requestBody: {content: {application/json: {schema: {type: object, properties: {note: {type: string}}}}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Proposal"}}}}
  /api/proposals/{proposal_id}/evidence:
    parameters: [{$ref: "#/components/parameters/proposal_id"}]
    post:
      tags: [automations]
      operationId: computeEvidence
      x-milestone: M4
      summary: Simulate the draft's triggers against HA history ("what would this have done in the last N days")
      requestBody: {content: {application/json: {schema: {type: object, properties: {days: {type: integer, default: 7, maximum: 30}}}}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Evidence"}}}}
  /api/proposals/{proposal_id}/revise:
    parameters: [{$ref: "#/components/parameters/proposal_id"}]
    post:
      tags: [automations]
      operationId: reviseProposal
      x-milestone: M5
      summary: >-
        A model changes the automation as the owner asks in words, on the model the owner picks. An
        open proposal is edited in place; a deployed one gets a new draft that changes it; a rejected
        one a new draft that starts from its YAML. Never deploys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction]
              properties:
                instruction: {type: string, maxLength: 2000}
                provider: {$ref: "#/components/schemas/ProviderChoice"}
      responses:
        "200": {description: the revised or new proposal, content: {application/json: {schema: {$ref: "#/components/schemas/Proposal"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/proposals/{proposal_id}/explain:
    parameters: [{$ref: "#/components/parameters/proposal_id"}]
    post:
      tags: [automations]
      operationId: explainProposal
      x-milestone: M5
      summary: A short plain-language description of the automation by a model (cached per YAML and language; empty text when `cached_only` finds none)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: {$ref: "#/components/schemas/ProviderChoice"}
                language: {type: string, description: "UI language code, e.g. en, ru"}
                fresh: {type: boolean, description: ask again instead of the cached text}
                cached_only: {type: boolean, description: "the cached text or an empty one; never calls a model (the page asks on open)"}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [text, provider]
                properties:
                  text: {type: string}
                  provider: {type: string}
                  run_id: {type: [string, "null"]}
                  cached: {type: boolean}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/automation-yaml:
    post:
      tags: [automations]
      operationId: convertAutomationYaml
      x-milestone: M5
      summary: "For the flow editor: `yaml` → `config` (normalized object) or `config` → `yaml`. Stores nothing."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                yaml: {type: string}
                config: {type: object}
                part: {type: boolean, description: "one trigger, condition or step: parsed as is, not normalized as an automation"}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [yaml, config]
                properties:
                  yaml: {type: string}
                  config: {type: object}
        "400": {$ref: "#/components/responses/Error"}
  /api/automations:
    get:
      tags: [automations]
      operationId: listDeployed
      x-milestone: M4
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/DeployedAutomation"}}}}}
  /api/automations/{ha_id}:
    parameters: [{$ref: "#/components/parameters/ha_id"}]
    get:
      tags: [automations]
      operationId: getDeployed
      x-milestone: M4
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/DeployedAutomation"}}}}
    delete:
      tags: [automations]
      operationId: removeDeployed
      x-milestone: M4
      summary: Remove an agent_house_ automation from HA (versions are kept for the record)
      responses:
        "204": {description: removed}
  /api/automations/{ha_id}/rollback:
    parameters: [{$ref: "#/components/parameters/ha_id"}]
    post:
      tags: [automations]
      operationId: rollbackDeployed
      x-milestone: M4
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [version], properties: {version: {type: integer}}}}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/DeployedAutomation"}}}}
  /api/automations/{ha_id}/enabled:
    parameters: [{$ref: "#/components/parameters/ha_id"}]
    put:
      tags: [automations]
      operationId: setDeployedEnabled
      x-milestone: M4
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [enabled], properties: {enabled: {type: boolean}}}}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/DeployedAutomation"}}}}

  /api/migration/import:
    post:
      tags: [migration]
      operationId: importOriginals
      x-milestone: M5
      summary: Read-only import of the owner's HA automations/scripts and Node-RED exports in /share/agent_house/nodered
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: {type: integer}
                  updated: {type: integer}
                  total: {type: integer}
                  skipped: {type: array, items: {type: string}, description: "what could not be read, and why"}
  /api/migration/originals:
    get:
      tags: [migration]
      operationId: listOriginals
      x-milestone: M5
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Original"}}}}}
  /api/migration/originals/{original_id}/propose:
    parameters: [{$ref: "#/components/parameters/original_id"}]
    post:
      tags: [migration]
      operationId: proposeReplacement
      x-milestone: M5
      summary: Ask the orchestrator for an equivalent agent-managed automation (creates a proposal)
      responses:
        "202": {description: queued, content: {application/json: {schema: {type: object, required: [run_id], properties: {run_id: {type: string}}}}}}
  /api/migration/originals/{original_id}/parity:
    parameters: [{$ref: "#/components/parameters/original_id"}]
    get:
      tags: [migration]
      operationId: getParity
      x-milestone: M5
      parameters: [{name: days, in: query, schema: {type: integer, default: 7}}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Parity"}}}}
  /api/migration/originals/{original_id}/enabled:
    parameters: [{$ref: "#/components/parameters/original_id"}]
    put:
      tags: [migration]
      operationId: setOriginalEnabled
      x-milestone: M5
      summary: Explicit owner action. Uses automation.turn_off / turn_on; never edits or deletes the original.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [enabled], properties: {enabled: {type: boolean}}}}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Original"}}}}

  /api/council:
    get:
      tags: [council]
      operationId: getCouncil
      x-milestone: M5
      summary: House mode, ownership summary, the orchestrator's wakes, the daily review's state
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Council"}}}}
  /api/council/owner/{entity_id}:
    parameters: [{name: entity_id, in: path, required: true, schema: {type: string}}]
    get:
      tags: [council]
      operationId: getOwner
      x-milestone: M5
      summary: The one actor that owns an entity (D40 - `orchestrator`, or null for network pairing switches)
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [entity_id, owner]
                properties:
                  entity_id: {type: string}
                  owner: {type: [string, "null"]}
                  area: {type: [string, "null"]}
        "404": {$ref: "#/components/responses/Error"}
  /api/council/mode-helper:
    post:
      tags: [council]
      operationId: createModeHelper
      x-milestone: M5
      summary: Create input_select.agent_house_mode in HA (owner click; refuses when it exists)
      responses:
        "201": {description: created, content: {application/json: {schema: {type: object, required: [entity_id], properties: {entity_id: {type: string}}}}}}
        "409": {$ref: "#/components/responses/Error"}
  /api/council/review:
    post:
      tags: [council]
      operationId: runReview
      x-milestone: M5
      summary: Run the daily house review now (in the background; the result goes to the inbox)
      responses:
        "202": {description: started, content: {application/json: {schema: {type: object, properties: {status: {type: string}}}}}}
        "409": {$ref: "#/components/responses/Error"}
  /api/council/scan:
    post:
      tags: [council]
      operationId: scanHistory
      x-milestone: M5
      summary: Deterministic logbook scan for habits, undone automations and conflicts (no model)
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/ScanResult"}}}}
        "502": {$ref: "#/components/responses/Error"}
  /api/findings:
    get:
      tags: [council]
      operationId: listFindings
      x-milestone: M5
      parameters: [{name: status, in: query, schema: {type: string, enum: [new, drafting, drafted, failed, dismissed]}}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Finding"}}}}}
  /api/findings/{finding_id}/draft:
    parameters: [{name: finding_id, in: path, required: true, schema: {type: string}}]
    post:
      tags: [council]
      operationId: draftFinding
      x-milestone: M5
      summary: Ask the orchestrator for one proposal from this finding
      responses:
        "202": {description: drafting, content: {application/json: {schema: {type: object, properties: {status: {type: string}}}}}}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/findings/{finding_id}/dismiss:
    parameters: [{name: finding_id, in: path, required: true, schema: {type: string}}]
    post:
      tags: [council]
      operationId: dismissFinding
      x-milestone: M5
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Finding"}}}}
        "404": {$ref: "#/components/responses/Error"}

  /api/manager:
    get:
      tags: [council]
      operationId: getManager
      x-milestone: M5
      summary: The house manager (D27) - settings, wakes in the last hour, what the prefilter sees now
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/ManagerStatus"}}}}
  /api/manager/wake:
    post:
      tags: [council]
      operationId: wakeManager
      x-milestone: M5
      summary: Wake the house manager now (capped per hour; refused with the kill switch engaged)
      requestBody:
        content: {application/json: {schema: {type: object, properties: {reason: {type: string, maxLength: 500}}}}}
      responses:
        "202":
          description: started or queued
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [started, queued]}
                  enabled: {type: boolean, description: manager_enabled at the time of the wake}
                  note: {type: string, description: what this run may do (with the manager off it switches nothing)}
        "409": {$ref: "#/components/responses/Error"}
  /api/metrics:
    get:
      tags: [council]
      operationId: getMetrics
      x-milestone: M5
      summary: Accuracy of each automation of ours and each actor (orchestrator, learner), and the house score (D28; no model)
      parameters: [{name: days, in: query, schema: {type: integer, minimum: 1, maximum: 30, default: 7}}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Metrics"}}}}
        "502": {$ref: "#/components/responses/Error"}

  /api/learner:
    get:
      tags: [council]
      operationId: getLearner
      x-milestone: M6
      summary: The Jetson learner (D38) - the link that forwards the house to it, its journal and training, the house model it learnt, and what its live suggestions did
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/LearnerInfo"}}}}
  /api/learner/train:
    post:
      tags: [council]
      operationId: trainLearner
      x-milestone: M6
      summary: Ask the learner to train now instead of at night
      responses:
        "202": {description: started, content: {application/json: {schema: {type: object, properties: {ok: {type: boolean}}}}}}
        "409": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}

  /api/chat:
    post:
      tags: [chat]
      operationId: chat
      x-milestone: M5
      summary: One chat turn with the orchestrator; answers when the run finishes (404 for any other target)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                target: {type: string, enum: [orchestrator], default: orchestrator}
                message: {type: string, maxLength: 4000}
                session_id: {type: string}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [session_id, run]
                properties:
                  session_id: {type: string}
                  reply: {type: string}
                  run: {$ref: "#/components/schemas/Run"}

  /api/settings:
    get:
      tags: [settings]
      operationId: getSettings
      x-milestone: M1
      summary: Effective settings, secrets replaced by "***"
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Settings"}}}}
    put:
      tags: [settings]
      operationId: putSettings
      x-milestone: M2
      summary: Change GUI-editable settings (stored in /data/settings.yaml). Add-on options (HA Configuration tab) stay read-only here.
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Settings"}}}}
  /api/dev:
    get:
      tags: [system]
      operationId: getDev
      x-milestone: M6
      summary: >-
        Developer tools (D40) - one read-only snapshot of the add-on's internals: the learner and the house
        model as received from the Jetson, the house manager, the orchestrator's providers and last calls,
        the policy, the council, the store, Home Assistant and the effective configuration. Secrets are
        masked; no prompt or model answer is in it.
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/DevSnapshot"}}}}
  /api/logs:
    get:
      tags: [settings]
      operationId: getLogs
      x-milestone: M1
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 200, maximum: 2000}}
        - {name: level, in: query, schema: {type: string, enum: [debug, info, warning, error]}}
      responses:
        "200":
          description: in-memory ring buffer, newest last
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [ts, level, logger, message]
                  properties:
                    ts: {type: number}
                    level: {type: string}
                    logger: {type: string}
                    message: {type: string}
  /api/diagnostics:
    get:
      tags: [settings]
      operationId: getDiagnostics
      x-milestone: M1
      summary: "Diagnostics bundle (zip) with manifest.json per schemas/diagnostics_manifest.schema.json; no secrets"
      responses:
        "200": {description: zip, content: {application/zip: {schema: {type: string, format: binary}}}}
  /api/config/export:
    get:
      tags: [settings]
      operationId: exportConfig
      x-milestone: M5
      responses:
        "200": {description: "YAML with the policy and the GUI settings (no secrets)", content: {text/yaml: {schema: {type: string}}}}
  /api/config/import:
    post:
      tags: [settings]
      operationId: importConfig
      x-milestone: M5
      summary: All or nothing. `agents` and `active_profile` of an export from before 0.5.0 are ignored and named in `ignored`.
      requestBody: {required: true, content: {text/yaml: {schema: {type: string}}}}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [policy, settings, ignored]
                properties:
                  policy: {type: boolean}
                  settings: {type: boolean}
                  ignored: {type: array, items: {type: string, enum: [agents, active_profile]}}
        "422": {$ref: "#/components/responses/Error"}

components:
  parameters:
    run_id: {name: run_id, in: path, required: true, schema: {type: string}}
    proposal_id: {name: proposal_id, in: path, required: true, schema: {type: string}}
    ha_id: {name: ha_id, in: path, required: true, schema: {type: string, pattern: "^agent_house_[a-z0-9_]+$"}}
    original_id: {name: original_id, in: path, required: true, schema: {type: string}}
  responses:
    Error:
      description: error
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string, description: "machine code, e.g. not_found, method_not_allowed, kill_switch, policy_blocked"}
        detail: {type: string}
    Mode: {type: string, enum: [shadow, live]}
    Tier: {type: string, enum: [T0, T1, T2, T3]}
    Verdict:
      type: string
      enum: [executed, shadow, denied, pending, approved, expired, failed]
      description: |
        executed = sent to HA; shadow = would have been sent; denied = policy refused;
        pending = waiting for human approval (T2); approved = approved and executed;
        expired = approval timed out or was denied by the owner; failed = HA returned an error.
    RunStatus: {type: string, enum: [queued, running, ok, error, timeout, dropped, escalated]}
    ProposalStatus: {type: string, enum: [draft, blocked, approved, deployed, rejected, superseded, rolled_back]}
    Status:
      type: object
      required: [version, mode, kill_switch, ha, learner, orchestrator, counts]
      properties:
        version: {type: string}
        time: {type: string, format: date-time}
        mode: {$ref: "#/components/schemas/Mode"}
        kill_switch:
          type: object
          required: [engaged]
          properties:
            engaged: {type: boolean}
            since: {type: [string, "null"], format: date-time}
            reason: {type: [string, "null"]}
        ha: {$ref: "#/components/schemas/HaStatus"}
        learner: {$ref: "#/components/schemas/LearnerBrief"}
        orchestrator: {$ref: "#/components/schemas/OrchestratorStatus"}
        counts:
          type: object
          properties:
            pending_approvals: {type: integer}
            draft_proposals: {type: integer}
            deployed_automations: {type: integer}
            runs_today: {type: integer}
    HaStatus:
      type: object
      required: [connected, state]
      properties:
        connected: {type: boolean}
        state: {type: string, enum: [connecting, connected, auth_failed, unreachable]}
        via_supervisor: {type: boolean}
        version: {type: [string, "null"]}
        location_name: {type: [string, "null"]}
        last_error: {type: [string, "null"]}
        last_event_ts: {type: [number, "null"]}
        reconnects: {type: integer}
        areas: {type: integer}
        entities: {type: integer}
    LearnerBrief:
      type: object
      required: [configured, connected, mode, fresh]
      description: the Jetson learner in one line (D38); details in LearnerInfo
      properties:
        configured: {type: boolean, description: "jetson_learner_url is set"}
        connected: {type: boolean}
        mode: {$ref: "#/components/schemas/Mode"}
        fresh: {type: boolean, description: "a house model trained in the last 48 h is stored"}
        error: {type: [string, "null"]}
    OrchestratorStatus:
      type: object
      required: [provider]
      properties:
        provider: {type: string, enum: [anthropic, openai, auto], description: "the setting (`local` from before 0.5.0 reads as auto)"}
        effective: {type: string, enum: [anthropic, openai, none], description: what a request would use right now}
        choices:
          type: object
          description: which cloud models the owner can pick per request (key set)
          properties:
            anthropic: {type: boolean}
            openai: {type: boolean}
        model: {type: [string, "null"]}
        budget:
          type: object
          properties:
            daily_limit_eur: {type: number}
            spent_today_eur: {type: number}
            tokens_in_today: {type: integer}
            tokens_out_today: {type: integer}
            exhausted: {type: boolean}
    Area:
      type: object
      required: [area_id, name, entity_count]
      properties:
        area_id: {type: string}
        name: {type: string}
        entity_count: {type: integer}
    Entity:
      type: object
      required: [entity_id, domain, state, tier]
      properties:
        entity_id: {type: string}
        domain: {type: string}
        name: {type: [string, "null"]}
        area_id: {type: [string, "null"]}
        state: {type: [string, "null"]}
        unit: {type: [string, "null"]}
        device_class: {type: [string, "null"]}
        tier: {$ref: "#/components/schemas/Tier"}
        read_only: {type: boolean, description: "sensor-like domain with nothing to actuate (tier is T3)"}
        last_changed: {type: [string, "null"]}
        hidden: {type: boolean}
    FeedItem:
      type: object
      required: [id, ts, kind, summary]
      properties:
        id: {type: integer}
        ts: {type: number}
        kind:
          type: string
          description: "state | gate_drop | action | approval | report | proposal | deploy | system | council"
        summary: {type: string}
        agent_id: {type: [string, "null"]}
        entity_id: {type: [string, "null"]}
        run_id: {type: [string, "null"]}
        level: {type: string, enum: [debug, info, warning, error], default: info}
        data: {type: [object, "null"]}
    RunSummary:
      type: object
      required: [id, agent_id, status, started]
      properties:
        id: {type: string}
        agent_id: {type: string, description: "`orchestrator` (runs before 0.5.0 may name a room agent)"}
        status: {$ref: "#/components/schemas/RunStatus"}
        wake_source: {type: string, description: "manual (the owner), poke (review, house manager drafts), chat, review, manage (the house manager); older runs: event, cron, schedule, task, replay"}
        wake_reason: {type: [string, "null"]}
        started: {type: number}
        ended: {type: [number, "null"]}
        latency_ms: {type: [integer, "null"]}
        steps: {type: integer}
        tokens_in: {type: integer}
        tokens_out: {type: integer}
        provider: {type: [string, "null"]}
        profile: {type: [string, "null"]}
        summary: {type: [string, "null"]}
        error: {type: [string, "null"]}
        shadow: {type: boolean}
        replay_of: {type: [string, "null"]}
    Run:
      allOf:
        - {$ref: "#/components/schemas/RunSummary"}
        - type: object
          required: [trace]
          properties:
            trace:
              type: array
              items: {$ref: "#/components/schemas/Step"}
    Step:
      type: object
      required: [idx, type, ts]
      properties:
        idx: {type: integer}
        ts: {type: number}
        type: {type: string, enum: [context, origin, llm, tool, policy, repair, error, final]}
        latency_ms: {type: [integer, "null"]}
        tokens_in: {type: [integer, "null"]}
        tokens_out: {type: [integer, "null"]}
        data:
          type: object
          description: |
            context: {system, user}; llm: {provider, model, content, tool_calls, finish_reason, eur};
            tool: {name, arguments, result}; final: {text}
    Action:
      type: object
      required: [id, ts, agent_id, domain, service, entity_ids, tier, verdict, reason]
      properties:
        id: {type: string}
        ts: {type: number}
        run_id: {type: [string, "null"]}
        agent_id: {type: string, description: "orchestrator | learner (older rows may name a room agent)"}
        domain: {type: string}
        service: {type: string}
        entity_ids: {type: array, items: {type: string}}
        data: {type: object}
        tier: {$ref: "#/components/schemas/Tier"}
        verdict: {$ref: "#/components/schemas/Verdict"}
        reason: {type: string}
        decided_by: {type: [string, "null"], description: "`owner` once an approval was answered"}
        expires: {type: [number, "null"]}
    InboxItem:
      type: object
      required: [id, ts, agent_id, severity, summary, status]
      properties:
        id: {type: integer}
        ts: {type: number}
        agent_id: {type: string}
        run_id: {type: [string, "null"]}
        severity: {type: string, enum: [info, warning, alarm]}
        summary: {type: string}
        status: {type: string, enum: [new, seen, handled]}
    ProviderChoice:
      type: string
      enum: [anthropic, openai, auto]
      description: the model for this one request; absent (or anything else, `local` included) = the add-on setting orchestrator_provider
    Proposal:
      type: object
      required: [id, created, status, title, yaml]
      properties:
        id: {type: string}
        created: {type: number}
        status: {$ref: "#/components/schemas/ProposalStatus"}
        title: {type: string}
        yaml: {type: string}
        rationale: {type: [string, "null"]}
        expected_triggers: {type: [string, "null"]}
        origin_agent: {type: [string, "null"]}
        run_id: {type: [string, "null"]}
        ha_id: {type: [string, "null"], description: "agent_house_<slug>; set at creation, used at deploy"}
        replaces_original: {type: [string, "null"]}
        supersedes:
          type: array
          items: {type: string, pattern: "^agent_house_[a-z0-9_]+$"}
          description: >-
            Other deployed automations of ours this proposal replaces (never the owner's, never its
            own ha_id). Approving disables each of them first (reversible from the Deployed page);
            set only on drafts of the owner or the orchestrator (a settled conflict between two of ours).
        diff: {type: [string, "null"], description: unified diff against the currently deployed version (or against nothing)}
        checks:
          type: array
          items:
            type: object
            required: [name, ok]
            properties:
              name: {type: string, description: "yaml | schema | policy | ha_validate"}
              ok: {type: boolean}
              detail: {type: [string, "null"]}
        evidence: {oneOf: [{$ref: "#/components/schemas/Evidence"}, {type: "null"}]}
        note: {type: [string, "null"]}
    Evidence:
      type: object
      required: [days, would_fire, supported]
      properties:
        days: {type: integer}
        supported: {type: boolean, description: false when a trigger or a condition cannot be replayed from history}
        unsupported: {type: array, items: {type: string}, description: what was not replayed, triggers and conditions}
        fired: {type: integer, description: trigger firings in the window, before conditions}
        blocked: {type: integer, description: firings the conditions would have stopped}
        would_fire: {type: integer, description: firings that pass the conditions (fired - blocked)}
        samples: {type: array, items: {type: object, properties: {ts: {type: number}, trigger: {type: string}}}}
        conditions_evaluated: {type: boolean, description: "false: some condition could not be checked (listed in unsupported) and let the firings through, so would_fire is an upper bound"}
        computed: {type: number}
    DeployedAutomation:
      type: object
      required: [ha_id, title, current_version, enabled, versions]
      properties:
        ha_id: {type: string}
        entity_id: {type: [string, "null"]}
        title: {type: string}
        current_version: {type: integer}
        enabled: {type: boolean}
        present_in_ha: {type: boolean}
        origin_agent: {type: [string, "null"]}
        run_id: {type: [string, "null"]}
        versions:
          type: array
          items:
            type: object
            required: [version, created, yaml]
            properties:
              version: {type: integer}
              created: {type: number}
              yaml: {type: string}
              proposal_id: {type: [string, "null"]}
              note: {type: [string, "null"]}
    Council:
      type: object
      required: [mode, mode_entity, mode_entity_present, modes, auto_house_mode, orchestrator_mode, learner_mode, ownership, review, orchestrator_wakes]
      properties:
        mode: {type: [string, "null"], enum: [home, away, night, guests, work, null]}
        mode_entity: {type: string, const: input_select.agent_house_mode}
        mode_entity_present: {type: boolean}
        modes: {type: array, items: {type: string}}
        auto_house_mode: {type: boolean}
        orchestrator_mode: {$ref: "#/components/schemas/Mode"}
        learner_mode: {$ref: "#/components/schemas/Mode"}
        night_window: {type: string}
        ownership:
          type: object
          properties:
            counts: {type: object, additionalProperties: {type: integer}, description: "owner → number of entities (`orchestrator`, `nobody` for pairing switches)"}
        orchestrator_wakes:
          type: array
          description: The fixed rules that wake the orchestrator, with the last time each fired.
          items:
            type: object
            required: [id, rule, active, last]
            properties:
              id: {type: string, enum: [person, daily_review, manager_sweep]}
              rule: {type: string}
              active: {type: boolean, description: "false: the rule is switched off (auto_house_mode off, no daily_review_at)"}
              last: {type: [number, "null"], description: epoch seconds of the last time it fired}
        review:
          type: object
          properties:
            at: {type: [string, "null"]}
            running: {type: boolean}
            last: {type: [object, "null"]}
        last_scan: {type: [object, "null"], description: "the last history scan without its findings; `habits` is its funnel (ScanResult.habits)"}
        first_look: {type: [object, "null"], description: "the first scan after install (D31): when, how many drafted, the habit funnel; null until it ran"}
    LearnerInfo:
      type: object
      required: [configured, mode, link, model]
      properties:
        configured: {type: boolean, description: "jetson_learner_url is set"}
        mode: {type: string, enum: [shadow, live], description: "learner_mode: live suggestions only act when live (and policy allows)"}
        link:
          type: object
          description: the add-on's side - forwarding, buffer, backfill
          properties:
            connected: {type: boolean}
            last_push: {type: [number, "null"]}
            pushed: {type: integer}
            buffered: {type: integer}
            dropped: {type: integer, description: events lost because the buffer was full}
            error: {type: [string, "null"]}
            backfill: {type: object, description: "{state: idle|running|done|failed, from, to, days, error}"}
            registry_sent: {type: [number, "null"]}
        jetson: {type: [object, "null"], description: "schemas/learner_status.schema.json, null while unreachable"}
        model:
          type: [object, "null"]
          description: summary of schemas/house_model.schema.json (counts and the strongest items); null before the first training
        live:
          type: object
          description: what the live suggestions did today
          properties:
            acted: {type: integer}
            shadow: {type: integer}
            denied: {type: integer}
            recent: {type: array, items: {type: object}}
    ManagerStatus:
      type: object
      required: [enabled, mode, anomalies, owned, weak]
      properties:
        enabled: {type: boolean}
        mode: {type: string, enum: [shadow, live]}
        sweep_min: {type: integer}
        max_wakes_per_hour: {type: integer}
        wakes_last_hour: {type: integer}
        running: {type: boolean}
        last_run: {type: [number, "null"]}
        last_run_id: {type: [string, "null"], description: the run (trace) of the last manager run}
        anomalies: {type: array, items: {type: string}, description: "what the deterministic prefilter would wake the model for"}
        owned: {type: array, items: {type: string}, description: "entities the manager may actuate (switchable, visible; no config/diagnostic entities, no pairing switches, no device noise)"}
        owned_note: {type: string, description: plain-language explanation of `owned` for the owner}
        hint: {type: [string, "null"], description: "while off: what that means and how to turn it on"}
        weak: {type: array, items: {type: object, properties: {ha_id: {type: string}, title: {type: [string, "null"]}}}}
        checked: {type: string}
    Rate:
      type: object
      description: "A proportion with its 95 % Wilson interval; value/low/high are null below min_n outcomes"
      required: [value, low, high, n]
      properties:
        value: {type: [number, "null"]}
        low: {type: [number, "null"]}
        high: {type: [number, "null"]}
        n: {type: integer}
    Metrics:
      type: object
      required: [days, min_n, automations, agents, program]
      properties:
        days: {type: integer}
        min_n: {type: integer}
        undo_window_s: {type: number}
        automations:
          type: array
          items:
            type: object
            required: [ha_id, kept, undone, unobserved, missed, precision, coverage, f1]
            properties:
              ha_id: {type: string}
              title: {type: [string, "null"]}
              version: {type: [integer, "null"]}
              kept: {type: integer}
              undone: {type: integer}
              unobserved: {type: integer}
              missed: {type: integer}
              precision: {$ref: "#/components/schemas/Rate"}
              coverage: {$ref: "#/components/schemas/Rate"}
              f1: {type: [number, "null"]}
              examples: {type: array, items: {type: string}}
              previous:
                type: array
                description: >-
                  Earlier versions with outcomes in the window, each scored over its own time span
                  (same fields, no `previous`); the program counts include them.
                items: {type: object}
        agents:
          type: array
          description: "per actor of ours that acted live (`orchestrator`, `learner`)"
          items:
            type: object
            required: [agent_id, kept, undone, precision]
            properties:
              agent_id: {type: string}
              kept: {type: integer}
              undone: {type: integer}
              unobserved: {type: integer}
              precision: {$ref: "#/components/schemas/Rate"}
              examples: {type: array, items: {type: string}}
        program:
          type: object
          required: [precision, coverage, score, score_low, house_share, counts]
          properties:
            precision: {$ref: "#/components/schemas/Rate"}
            coverage: {$ref: "#/components/schemas/Rate"}
            score: {type: [number, "null"], description: "F1 of the pooled precision and coverage"}
            score_low: {type: [number, "null"], description: "F1 of the two Wilson lower bounds (conservative)"}
            house_share: {$ref: "#/components/schemas/Rate"}
            counts: {type: object, additionalProperties: {type: integer}}
        history: {type: array, items: {type: object}, description: "one row per daily review, last 90 days"}
    Finding:
      type: object
      required: [id, kind, status, title, request, data, created, updated]
      properties:
        id: {type: string, description: "stable key, e.g. habit:<entity> (one per device), undo:<ha_id>:v<n>, conflict:<entity>:<sides>"}
        kind: {type: string, enum: [habit, undo, conflict, timeout], description: "timeout: a light controller the owner keeps correcting (D38 learner)"}
        status: {type: string, enum: [new, drafting, drafted, failed, dismissed]}
        title: {type: string}
        request: {type: string, description: what the orchestrator is asked to draft}
        data: {type: object, description: the counts behind it (deterministic evidence)}
        room: {type: [string, "null"]}
        ha_id: {type: [string, "null"]}
        proposal_id: {type: [string, "null"]}
        run_id: {type: [string, "null"]}
        created: {type: number}
        updated: {type: number}
    ScanResult:
      type: object
      required: [changes, manual, findings, feedback, scanned]
      properties:
        changes: {type: integer}
        manual: {type: integer}
        findings: {type: array, items: {$ref: "#/components/schemas/Finding"}}
        feedback:
          type: array
          items:
            type: object
            properties:
              ha_id: {type: string}
              acted: {type: integer}
              undone: {type: integer}
              rate: {type: number}
              flagged: {type: boolean}
        scanned: {type: number}
        habits:
          type: object
          description: >-
            How the habit predictions (D35) narrowed the house down, so "no proposal" explains itself:
            entities in HA → switchable → changed by hand → relevant → a rule worth acting on or asking.
          properties:
            days: {type: integer}
            min_days: {type: integer}
            entities: {type: integer}
            switchable: {type: integer}
            changed_by_hand: {type: integer}
            relevant: {type: integer}
            predictions: {type: integer, description: device states with a rule proven out of sample (act or ask)}
            irregular: {type: integer, description: device states no situation predicts well enough (they wait)}
            waiting:
              type: array
              items: {type: string}
              description: '"entity → state" that wait: no rule proven yet, or over the ask budget'
            asks_per_day: {type: number, description: expected asks a day of the proposed ask automations}
            covered_by_owner:
              type: array
              description: device states the owner's own automations, scripts or programs already run (D34)
              items:
                type: object
                properties:
                  entity_id: {type: string}
                  state: {type: string}
                  by: {type: array, items: {type: string}}
            dossiers: {type: integer, description: same as predictions (kept for older GUIs)}
            left_out: {type: object, additionalProperties: {type: integer}, description: reason → devices}
            near:
              type: array
              description: devices changed by hand on too few days, with how many are needed
              items: {type: object, properties: {entity_id: {type: string}, days: {type: integer}, needed: {type: integer}}}
    Original:
      type: object
      required: [id, source, title, enabled]
      properties:
        id: {type: string}
        source: {type: string, enum: [ha_automation, ha_script, node_red]}
        entity_id: {type: [string, "null"]}
        title: {type: string}
        enabled: {type: [boolean, "null"]}
        summary: {type: [string, "null"]}
        config: {type: [object, "null"]}
        replacement_proposal_id: {type: [string, "null"]}
        replacement_ha_id: {type: [string, "null"]}
        disabled_by_us: {type: boolean}
    Parity:
      type: object
      required: [days, original_fired, replacement_would_fire, diffs]
      properties:
        days: {type: integer}
        original_fired: {type: integer}
        replacement_would_fire: {type: integer}
        matched: {type: integer, description: firings of both sides at most 60 s apart}
        supported: {type: boolean, description: "false when a trigger of either side cannot be replayed from history"}
        unsupported: {type: array, items: {type: string}}
        simulated: {type: boolean, description: "true: both sides are trigger replays, conditions are not evaluated"}
        diffs:
          type: array
          items:
            type: object
            properties:
              ts: {type: number}
              side: {type: string, enum: [original_only, replacement_only]}
              detail: {type: string}
    DevSnapshot:
      type: object
      required: [version, time, learner, manager, orchestrator, policy, council, store, ha, config]
      properties:
        version: {type: string}
        time: {type: string, format: date-time}
        learner:
          description: LearnerInfo plus what the Jetson came up with
          allOf:
            - {$ref: "#/components/schemas/LearnerInfo"}
            - type: object
              required: [targets, facts, house_model, live_suggestions]
              properties:
                targets: {type: array, items: {type: string}, description: "devices the learner may act on now (fresh model's live targets, no helpers)"}
                facts: {type: array, items: {type: string}, description: "what the learner knows as short lines (the orchestrator's prompts get these)"}
                house_model:
                  type: [object, "null"]
                  description: >-
                    The stored house model as received (schemas/house_model.schema.json): habits, routines,
                    dependencies, corrections, timeouts, usual_states, event_relevance, health, modes, asks,
                    live; null before the first training
                live_suggestions:
                  type: array
                  description: the last 50 live suggestions and the actuator's verdict for each
                  items:
                    type: object
                    properties:
                      ts: {type: number}
                      entity_id: {type: string}
                      state: {type: string}
                      p: {type: [number, "null"]}
                      verdict: {$ref: "#/components/schemas/Verdict"}
                      action_id: {type: string}
                tables:
                  type: object
                  properties:
                    usual_states: {type: integer, description: devices in the learner's usual-state table (unusual notes)}
                    habits_source: {type: [string, "null"], description: "`learner` when the last scan used the learner's habits, null for the add-on's own scan"}
        manager:
          allOf:
            - {$ref: "#/components/schemas/ManagerStatus"}
            - type: object
              properties:
                last_sweep: {type: [number, "null"], description: epoch seconds of the last sweep}
                runs:
                  type: array
                  description: the last manager runs (traces at api/runs/{id})
                  items:
                    type: object
                    properties:
                      id: {type: string}
                      started: {type: number}
                      status: {$ref: "#/components/schemas/RunStatus"}
                      provider: {type: [string, "null"]}
                      tokens_in: {type: integer}
                      tokens_out: {type: integer}
                      shadow: {type: boolean}
        orchestrator:
          allOf:
            - {$ref: "#/components/schemas/OrchestratorStatus"}
            - type: object
              required: [providers, last_calls]
              properties:
                providers: {type: array, items: {type: string, enum: [anthropic, openai]}, description: the order a request tries now}
                redact_cloud: {type: boolean}
                last_calls:
                  type: array
                  description: the last 20 model calls since the add-on started, newest first; never a prompt
                  items:
                    type: object
                    required: [ts, task, provider, ok]
                    properties:
                      ts: {type: number}
                      task: {type: string, description: "draft | habit | undo | conflict | explain | chat | routine | manage"}
                      provider: {type: string}
                      model: {type: [string, "null"]}
                      tokens_in: {type: integer}
                      tokens_out: {type: integer}
                      eur: {type: number}
                      ok: {type: boolean}
                      error: {type: [string, "null"]}
        policy:
          type: object
          required: [mode, kill_switch, tiers, recent]
          properties:
            mode: {$ref: "#/components/schemas/Mode"}
            kill_switch: {type: object}
            tiers: {type: object, additionalProperties: {type: integer}, description: "T0..T3 → entities in HA with that tier"}
            t3_whitelist: {type: array, items: {type: string}}
            pending_approvals: {type: integer}
            recent:
              type: array
              description: the last 20 policy decisions (the action log)
              items:
                type: object
                properties:
                  id: {type: string}
                  ts: {type: number}
                  agent_id: {type: string}
                  domain: {type: string}
                  service: {type: string}
                  entity_ids: {type: array, items: {type: string}}
                  tier: {$ref: "#/components/schemas/Tier"}
                  verdict: {$ref: "#/components/schemas/Verdict"}
                  reason: {type: string}
        council:
          type: object
          description: "Council without review / last_scan / first_look (api/council has those)"
        store:
          type: object
          properties:
            path: {type: string}
            rows: {type: object, additionalProperties: {type: integer}, description: rows per table}
        ha:
          allOf:
            - {$ref: "#/components/schemas/HaStatus"}
            - type: object
              properties:
                forwarder:
                  type: object
                  description: "LearnerBrief plus the forwarder's buffer: events waiting, lost, sent"
                  properties:
                    configured: {type: boolean}
                    connected: {type: boolean}
                    mode: {$ref: "#/components/schemas/Mode"}
                    fresh: {type: boolean}
                    error: {type: [string, "null"]}
                    buffered: {type: integer}
                    dropped: {type: integer}
                    pushed: {type: integer}
        config:
          type: object
          properties:
            options: {type: object, description: "add-on options, secrets \"***\", URLs without credentials"}
            runtime: {type: object, description: GUI-editable settings}
    Settings:
      type: object
      properties:
        options: {type: object, description: add-on options (read-only here), secrets masked}
        runtime: {type: object, description: GUI-editable settings}
        paths: {type: object}
