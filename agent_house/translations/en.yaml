configuration:
  log_level:
    name: Log level
    description: How much the add-on writes to its log.
  jetson_learner_url:
    name: Jetson learner URL
    description: >-
      Base URL of the learner from jetson/learner (D38), for example http://192.168.1.50:9200. The
      add-on forwards what happens in the house to it and reads back what it learnt. Optional.
  jetson_token:
    name: Jetson token
    description: >-
      Shared secret of the Jetson learner (/etc/agent-house/token), sent with every call to it.
      Optional without a learner.
  orchestrator_provider:
    name: Orchestrator provider
    description: >-
      auto uses Claude and, when it fails, OpenAI (only those with an API key, only while the daily
      budget lasts). anthropic or openai use only that one. local (from before 0.5.0: there is no
      local model any more) works like auto.
  anthropic_api_key:
    name: Anthropic API key
    description: Only needed when the orchestrator may use Claude. Stored by Home Assistant, never shown in the GUI.
  anthropic_model:
    name: Claude model
    description: Model id for the orchestrator, for example claude-haiku-5-5.
  openai_api_key:
    name: OpenAI API key
    description: Only needed when the orchestrator may use OpenAI. Stored by Home Assistant, never shown in the GUI.
  openai_model:
    name: OpenAI model
    description: Model id for the orchestrator, for example gpt-6.1-sol (or the cheaper gpt-6-luna).
  daily_budget_eur:
    name: Daily cloud budget (EUR)
    description: Hard stop for Claude API spending per day. 0 disables cloud calls.
  redact_cloud:
    name: Redact cloud prompts
    description: Remove names, coordinates and camera or media entities from anything sent to the cloud.
  t3_whitelist:
    name: T3 exceptions
    description: >-
      Exact entity ids (for example lock.front_door) the house manager and the learner may act on
      despite a T3 domain such as locks or alarms. They become T2: every action waits for your approval. Only settable here.
