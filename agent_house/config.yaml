# Home Assistant add-on ("app") manifest. Field reference: docs/RESEARCH.md §1.
name: Agent House
version: "0.1.0-dev.5"
slug: agent_house
description: LLM agents that watch your rooms, propose automations and act within strict safety tiers
url: https://github.com/vvvlladimir/agent-home
arch:
  - aarch64
  - amd64
init: false
# startup, boot, ingress_port (8099), panel_admin and hassio_api keep their defaults; the app linter
# rejects keys that only restate a default.
ingress: true
panel_icon: mdi:home-automation
panel_title: Agent House
homeassistant_api: true
map:
  - type: share
    read_only: true
options:
  log_level: info
  jetson_llm_url: ""
  jetson_metrics_url: ""
  orchestrator_provider: auto
  anthropic_model: claude-opus-5-5
  daily_budget_eur: 1.0
  redact_cloud: true
schema:
  log_level: list(debug|info|warning|error)
  jetson_llm_url: str?
  jetson_metrics_url: str?
  jetson_token: password?
  orchestrator_provider: list(auto|anthropic|local)
  anthropic_api_key: password?
  anthropic_model: str
  daily_budget_eur: float(0,100)
  redact_cloud: bool
