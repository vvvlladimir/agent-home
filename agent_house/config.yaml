# Home Assistant add-on ("app") manifest. Field reference: docs/RESEARCH.md §1.
name: Agent House
version: "0.5.0"
slug: agent_house
description: Learns your habits on a Jetson, drafts automations with a cloud model, acts only within strict safety tiers
url: https://github.com/vvvlladimir/agent-home
arch:
  - aarch64
  - amd64
init: false
# startup, boot, ingress_port (8099), panel_admin and hassio_api keep their defaults; the app linter
# rejects keys that only restate a default.
ingress: true
panel_icon: mdi:home-automation
panel_title: Agent House
homeassistant_api: true
map:
  - type: share
    read_only: true
options:
  log_level: info
  jetson_learner_url: ""
  orchestrator_provider: auto
  anthropic_model: claude-haiku-5-5
  openai_model: gpt-6.1-sol
  daily_budget_eur: 1.0
  redact_cloud: true
  t3_whitelist: []
schema:
  log_level: list(debug|info|warning|error)
  jetson_learner_url: str?
  jetson_token: password?
  # `local` stays valid so an install from before 0.5.0 keeps its options; it is read as `auto` (D40)
  orchestrator_provider: list(auto|anthropic|openai|local)
  anthropic_api_key: password?
  anthropic_model: str
  openai_api_key: password?
  openai_model: str
  daily_budget_eur: float(0,100)
  redact_cloud: bool
  t3_whitelist:
    - match(^[a-z0-9_]+\.[a-z0-9_]+$)
